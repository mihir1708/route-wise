name: RouteWise checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      ROUTEWISE_LIVE_EVAL: '0'
      ROUTEWISE_VERIFICATION_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run migrations:check
      - run: npm run eval:regression
      - run: npm run eval -- --dry-run --limit 3
      - run: npm run experiment
      - run: npm run build
      - run: git diff --check
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: routewise_test_only
          POSTGRES_DB: routewise_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: node scripts/test-postgres.mjs
        env:
          ROUTEWISE_DB_TEST_DISPOSABLE: '1'
          ROUTEWISE_TEST_DATABASE_URL: postgresql://postgres:routewise_test_only@localhost:5432/routewise_test
